[package]
name    = "collab"
version = "3.2.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[dependencies]
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
chacha20poly1305     = "0.10"   # XChaCha20-Poly1305: 24-byte nonces, no AES-NI needed
rand                 = "0.8"
sha2                 = "0.10"
ed25519-dalek        = { version = "2", features = ["rand_core"] }  # signed releases   # content addressing: the hash is the file's identity
base64               = "0.22"
time                 = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
